<!DOCTYPE html>
{% load filters %}

<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        {% block title %}
        {% endblock title %}
    </head>
    <body class="container mt-4 p-3 bg-light text-dark text-center">
        {% include "library/navbar.html" %}

        {% if messages %}
            {% for message in messages %}
                <div class="w-50 mx-auto mt-4 alert alert-{{ message.tags|replace:"error,danger" }}">{{ message }}</div>
            {% endfor %}
        {% endif %}

        {% block content %}
        {% endblock content %}
    </body>
</html>
